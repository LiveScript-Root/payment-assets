name: Reconstruct image

on:
  push:
    branches:
      - main
    paths:
      - "parts/**"
      - ".github/workflows/reconstruct-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct image
        run: |
          mkdir -p assets/telegram
          cat parts/*.part | base64 -d > assets/telegram/captura-pago-telegram.jpg
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telegram/captura-pago-telegram.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Telegram payment confirmation image"
          git push
